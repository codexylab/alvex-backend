name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true

      - name: Verify dependency checksums
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l api cmd pkg scratch)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files require gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Run web-only release tests
        # WhatsApp is intentionally deferred from the current web-chat release.
        # Keep its code compiling, but do not execute WhatsApp-specific tests.
        run: go test -race -count=1 -coverprofile=coverage.out -skip 'WhatsApp|ReceiveWhatsApp' ./...

      - name: Build API
        run: go build -trimpath ./cmd/server

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true

      - name: Scan reachable Go vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag alvex-backend:ci .

  postgres-migrations:
    name: Fresh PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: alvex
          POSTGRES_PASSWORD: alvex-ci-password
          POSTGRES_DB: alvex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alvex -d alvex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true

      - name: Apply migrations to a fresh database
        env:
          DATABASE_URL: postgres://alvex:alvex-ci-password@localhost:5432/alvex_ci?sslmode=disable
        run: go run ./cmd/migrate

      - name: Verify migrations are idempotent
        env:
          DATABASE_URL: postgres://alvex:alvex-ci-password@localhost:5432/alvex_ci?sslmode=disable
        run: go run ./cmd/migrate

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
